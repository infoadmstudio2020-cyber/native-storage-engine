name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-34 build-tools;34.0.0'

      - name: Cache Gradle packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
          restore-keys: |
            ${{ runner.os }}-gradle-

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Release AAR and APK
        run: |
          ./gradlew clean :native-storage-engine:assembleRelease :app:assembleRelease --stacktrace || ./gradlew clean :native-storage-engine:assembleRelease --stacktrace || {
            echo "Module task :native-storage-engine:assembleRelease failed or not found. Checking available tasks..."
            if ./gradlew tasks --all 2>/dev/null | grep -E "\bassembleRelease\b"; then
              ./gradlew clean assembleRelease --stacktrace
            else
              ./gradlew clean build --stacktrace
            fi
          }

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            native-storage-engine/build/outputs/aar/*.aar
            app/build/outputs/apk/release/*.apk
            **/build/outputs/aar/*.aar
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

